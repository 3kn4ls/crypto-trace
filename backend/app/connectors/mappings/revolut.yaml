# Revolut "Gains / Losses" tax export connector.
# One CSV row represents a completed round-trip: the asset is bought on
# ``Date acquired`` and sold on ``Date sold``. The connector emits two
# canonical transactions per row: a BUY and a SELL.
#
# NOTE: Revolut exports this report in USD. The connector converts each USD
# amount to EUR using the official ECB reference rate (via Frankfurter) for the
# corresponding date. If the API is unavailable, it falls back to the
# ``usd_to_eur_rate`` value below.
header_row: 1
decimal_sep: "."
date_formats:
  - "%Y-%m-%d"

columns:
  date_acquired: "Date acquired"
  date_sold: "Date sold"
  symbol: "Symbol"
  quantity: "Quantity"
  cost_basis: "Cost basis"
  gross_proceeds: "Gross proceeds"
  fees: "Fees"
  currency: "Currency"

# Fallback USD -> EUR rate, used only when the Frankfurter API is unreachable.
# Set to 1.0 to store raw USD values in that fallback case.
fallback_usd_to_eur_rate: 0.92
