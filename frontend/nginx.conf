server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploading reasonably large Excel exports.
    client_max_body_size 25m;

    # Proxy API calls to the backend service (keeps everything same-origin,
    # so the browser never needs CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (react-router) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
