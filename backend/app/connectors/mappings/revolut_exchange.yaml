# Revolut exchange export mapping (PROVISIONAL).
# Adjust column names and type_map to your real export; no code change needed.
sheet: 0
header_row: 1
decimal_sep: "."
date_formats:
  - "%Y-%m-%d %H:%M:%S"
  - "%d/%m/%Y %H:%M:%S"
  - "%Y-%m-%dT%H:%M:%S"

columns:
  timestamp: "Date"
  type: "Type"
  currency: "Currency"        # crypto leg
  amount: "Amount"
  to_currency: "To Currency"  # destination asset (exchanges)
  to_amount: "To Amount"
  fiat_amount: "Fiat amount"  # value in EUR
  fee_amount: "Fee"
  fee_asset: "Fee Currency"
  external_id: "ID"

# Revolut "Type" -> canonical TransactionType.
type_map:
  BUY: BUY
  SELL: SELL
  EXCHANGE: SWAP
  TRANSFER: TRANSFER
  DEPOSIT: DEPOSIT
  WITHDRAWAL: WITHDRAWAL
  CARD_PAYMENT: SPEND
  STAKING: STAKING_REWARD
  REWARD: STAKING_REWARD
  CASHBACK: REFERRAL
